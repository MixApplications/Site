name: Sync Play Store data

on:
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper
        run: npm install google-play-scraper@^10

      - name: Fetch live Play data
        run: node scripts/sync-play.mjs

      - name: Commit if changed
        run: |
          git config user.name  "play-sync"
          git config user.email "actions@users.noreply.github.com"
          git add play/data.json
          git diff --cached --quiet || { git commit -m "chore: sync Play Store data"; git push; }
