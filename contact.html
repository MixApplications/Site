<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Islam Darwish</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2980b9;
            --accent: #f39c12;
            --text: #333;
            --light-bg: #f8f9fa;
            --shadow: rgba(0, 0, 0, 0.08);
            --border-radius: 12px;
            --transition: all 0.3s ease;
            --whatsapp: #25D366;
            --whatsapp-dark: #128C7E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--light-bg);
            padding: 0;
            margin: 0;
        }

        .header {
            background-color: white;
            box-shadow: 0 2px 15px var(--shadow);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 0;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }

        .logo:hover {
            color: var(--secondary);
            transform: scale(1.05);
        }

        .nav-links a {
            margin-left: 1.5rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .page-header {
            text-align: center;
            margin: 2rem 0;
        }

        .page-title {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        .page-subtitle {
            color: #777;
            font-weight: normal;
            font-size: 1.1rem;
        }

        .contact-card {
            background-color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 30px var(--shadow);
            transition: var(--transition);
            max-width: 800px;
            margin: 0 auto 3rem auto;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        .section-title {
            color: var(--primary);
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            font-size: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 1.2rem;
            transition: var(--transition);
            padding: 0.5rem 0;
        }

        .info-item:hover {
            transform: translateX(5px);
        }

        .info-item i {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(52, 152, 219, 0.1);
            color: var(--primary);
            font-size: 1.2rem;
            border-radius: 50%;
            margin-right: 1rem;
            transition: var(--transition);
        }

        .info-item:hover i {
            background-color: var(--primary);
            color: white;
        }

        .email-link {
            color: var(--text);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
        }

        .email-link:hover {
            color: var(--primary);
        }

        .email-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .email-link:hover::after {
            width: 100%;
        }

        .info-item:hover .email-link {
            color: var(--primary);
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            background-color: var(--whatsapp);
            color: white;
            padding: 0.9rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            margin: 1rem 0;
        }

        .whatsapp-btn i {
            font-size: 1.5rem;
        }

        .whatsapp-btn:hover {
            background-color: var(--whatsapp-dark);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .whatsapp-btn:active {
            transform: translateY(1px);
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
        }

        @media (max-width: 576px) {
            .page-title {
                font-size: 2rem;
            }

            .contact-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <div class="container">
        <nav class="nav">
            <a href="/" class="logo">Islam Darwish</a>
            <div class="nav-links">
                <a href="/">Home</a>
            </div>
        </nav>
    </div>
</header>

<div class="container">
    <div class="page-header">
        <h1 class="page-title">Get In Touch</h1>
        <p class="page-subtitle">Questions, feedback, or project ideas? Reach out and let's talk!</p>
    </div>

    <div class="contact-card">
        <h2 class="section-title">Contact Information</h2>

        <div class="info-item">
            <i class="fas fa-envelope"></i>
            <a href="mailto:islam.saad2005@gmail.com" class="email-link">
                islam.saad2005@gmail.com
            </a>
        </div>

        <div class="whatsapp-contact">
            <a href="https://wa.me/201111707320" class="whatsapp-btn" target="_blank" rel="noopener">
                <i class="fab fa-whatsapp"></i> Message on WhatsApp
            </a>
        </div>
    </div>
</div>

<footer>
    <div class="container">
        <p>&copy; 2024 Islam Darwish. All Rights Reserved.</p>
    </div>
</footer>
</body>
</html>
